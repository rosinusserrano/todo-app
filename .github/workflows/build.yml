name: CI

# Analyze, test, and build every platform that ships.
#
# This used to be an iOS-only workflow, and the cost of that showed up in
# 0.23.1: the Android build had been failing outright - core library desugaring
# off, and an AGP version that could not compile several plugins - for an
# unknown length of time, with nothing to notice. Windows is the primary
# platform and had never been built here at all, and the server's own test suite
# had never run here either.
#
# **The four jobs are deliberately independent.** Gating the builds on `checks`
# would save a few runner-minutes and reintroduce exactly the failure this
# workflow exists to catch: one analyzer complaint would hide a platform that no
# longer compiles. This repository is public, so those minutes are free.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Analyzer, Flutter tests, server tests. Runs on Linux because none of it
  # needs a platform toolchain, and Linux is the cheapest and quickest runner.
  checks:
    name: Analyze and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show toolchain
        working-directory: app
        run: flutter --version

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze

      # test/sync_integration_test.dart skips itself without --dart-define, and
      # that is what keeps this safe to run here: it is a real client that
      # writes into whatever server it is pointed at.
      - name: Test
        working-directory: app
        run: flutter test

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install server dependencies
        run: npm ci

      # A schema change has to be made on both sides, so the server's tests are
      # part of the same gate as the app's rather than a thing to remember.
      - name: Server tests
        run: npm run test:server

  android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Pinned rather than left to the image's default: the app compiles Java
      # and Kotlin at 17 (see android/app/build.gradle.kts), and a runner
      # rolling forward to a newer default JDK is not a change this project
      # should find out about from a red build.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      # Signed with the debug keys - the release buildType says so. This
      # produces an installable APK for sideloading, not a Play Store upload.
      - name: Build release APK
        working-directory: app
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: todo-widget-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/app/outputs/flutter-apk/app-release.apk

  windows:
    name: Build Windows bundle
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Build Windows release
        working-directory: app
        run: flutter build windows --release

      # The whole bundle directory, not just the .exe: the app ships as an exe
      # beside its DLLs and its data/ folder, and install-windows.ps1 copies
      # exactly this directory. Half of it is not runnable.
      - uses: actions/upload-artifact@v4
        with:
          name: todo-widget-windows
          path: app/build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 30

  # Produces an UNSIGNED .ipa. GitHub's macOS runners have no access to an Apple
  # signing identity, and this project deliberately does not require a paid
  # Apple Developer account, so the archive is built with --no-codesign and
  # signed afterwards on your own machine.
  #
  # To install on an iPhone:
  #   1. Download the "Runner-unsigned-ipa" artifact from this run (or the file
  #      attached to the release, if this ran from a tag).
  #   2. Open it with Sideloadly or AltStore and sign with your Apple ID.
  #   3. On the phone: Settings > General > VPN & Device Management > trust the
  #      developer certificate.
  #
  # A free Apple ID signs apps for 7 days, after which the app stops launching
  # and must be re-signed with the same tool. AltStore can refresh it
  # automatically while the phone is on the same network as AltServer.
  #
  # To move to real signing later, the only change needed is to drop
  # --no-codesign, add an ExportOptions.plist, and import a certificate from
  # secrets - the rest of this job stays as it is.
  ios:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Build unsigned iOS release
        working-directory: app
        run: flutter build ios --release --no-codesign

      # An .ipa is just a zip with the .app inside a top-level Payload/
      # directory. `flutter build ipa` would normally do this, but it insists on
      # an export method and a signing identity, neither of which exist here.
      - name: Package Runner.app into an .ipa
        working-directory: app
        run: |
          set -euo pipefail
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          cd build/ipa
          zip -qry Runner-unsigned.ipa Payload
          ls -lh Runner-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Runner-unsigned-ipa
          path: app/build/ipa/Runner-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      # Tagged builds also get a permanent download link, so a known-good
      # version can be re-installed later without re-running CI (artifacts
      # expire, releases do not).
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/ipa/Runner-unsigned.ipa
          body: |
            Unsigned iOS build. Sign with Sideloadly or AltStore using your
            Apple ID, then trust the certificate under
            Settings > General > VPN & Device Management.
