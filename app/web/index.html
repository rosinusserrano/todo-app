<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Todo Widget, in the browser.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <!-- The strip round the clock is the page's own colour: no
       apple-mobile-web-app-status-bar-style (black or black-translucent both
       left it white), a theme-color, and html/body painted the app's colour.
       The app sets both to its window's colour as the workspace tint changes
       (todoChromeColor below) and keeps its content under the strip with
       todoSafeTop(). Co-note's recipe, which works. -->
  <meta name="theme-color" content="#27272B">
  <style>html, body { background: #27272B; }</style>
  <meta name="apple-mobile-web-app-title" content="Todo">
  <!-- 180px at the root, where iOS also looks on its own: a missing one was
       answered with this page, and the home screen drew a letter instead. -->
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Todo</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // Flutter replaces this page's viewport tag with its own, and the tag is
    // amended as it arrives, for two things:
    //
    // The home indicator. Flutter's has no viewport-fit=cover, and without
    // that iOS reports env(safe-area-inset-bottom) as zero. todoSafeBottom()
    // is read by lib/web_safe_area_web.dart, because Flutter's web engine
    // reports no safe area of its own.
    //
    // The zoom on focus. Flutter's says maximum-scale=5.0, and iOS zooms the
    // page into any text field whose font is under 16px - which is every
    // field here, since the hidden input Flutter types into carries the
    // field's own size. Flutter takes every touch, so the pinch that would
    // zoom back out never reaches Safari and the page stayed magnified.
    // maximum-scale=1 stops the zoom; the app has its own (Settings → Zoom).
    //
    // Cover only from the home screen, though. In a browser tab (Safari and
    // Firefox are both WebKit on iOS) it runs the page under the browser's
    // own bottom toolbar, and a tap there brings the toolbar back instead of
    // reaching the dock. Without it the tab ends above the toolbar, and the
    // browser keeps clear of the home indicator itself.
    (function () {
      var standalone =
        navigator.standalone === true ||
        (window.matchMedia &&
          window.matchMedia('(display-mode: standalone)').matches);
      function cover(meta) {
        if (meta.name !== 'viewport') return;
        var content = meta.content.replace(/,?\s*maximum-scale=[^,]*/, '');
        if (standalone && !/viewport-fit/.test(content)) {
          content += ', viewport-fit=cover';
        }
        content += ', maximum-scale=1.0';
        if (meta.content !== content) meta.content = content;
      }
      new MutationObserver(function (changes) {
        changes.forEach(function (c) {
          c.addedNodes.forEach(function (n) {
            if (n.tagName === 'META') cover(n);
          });
        });
      }).observe(document.head, { childList: true });
      // The keyboard on iOS (lib/web_keyboard.dart): focused inside a tap,
      // this brings the keyboard up so the field built a frame later can
      // take it over. 16px so iOS does not zoom to it; off-screen and
      // transparent so nothing is seen; gone once the real field has focus.
      window.todoPrimeKeyboard = function () {
        var input = document.createElement('input');
        input.setAttribute('aria-hidden', 'true');
        input.tabIndex = -1;
        input.style.cssText =
          'position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;' +
          'font-size:16px;border:0;padding:0;pointer-events:none';
        document.body.appendChild(input);
        input.focus();
        setTimeout(function () { input.remove(); }, 1000);
      };
      // Voice notes for the thought pane (voice_recorder_web.dart). Recorded,
      // not transcribed: the browser's recognisers garble anything but the
      // plainest sentence. AAC in MP4 where the browser can make it, since
      // that plays everywhere - Safari, Chrome and the desktop app's mpv;
      // Opus in WebM otherwise. 32 kbit/s is plenty for a voice: about
      // 240 kB a minute.
      var recorder = null, recStream = null, recChunks = [], recStart = 0;
      function recRelease() {
        if (recStream) recStream.getTracks().forEach(function (t) { t.stop(); });
        recStream = null;
        recorder = null;
        recChunks = [];
      }
      window.todoRecorder = {
        supported: function () {
          return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia &&
            window.MediaRecorder);
        },
        // onStarted() once the microphone is live; onError(reason) instead.
        start: function (onStarted, onError) {
          if (recorder) { onError('busy'); return; }
          navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
            recStream = stream;
            var types = ['audio/mp4;codecs=mp4a.40.2', 'audio/mp4',
              'audio/webm;codecs=opus', 'audio/webm'];
            var type = '';
            for (var i = 0; i < types.length; i++) {
              if (MediaRecorder.isTypeSupported(types[i])) { type = types[i]; break; }
            }
            var options = { audioBitsPerSecond: 32000 };
            if (type) options.mimeType = type;
            var rec;
            try { rec = new MediaRecorder(stream, options); }
            catch (e) { rec = new MediaRecorder(stream); }
            recorder = rec;
            recChunks = [];
            rec.ondataavailable = function (e) {
              if (e.data && e.data.size) recChunks.push(e.data);
            };
            rec.start(1000);
            recStart = Date.now();
            onStarted();
          }, function (err) {
            recRelease();
            var name = (err && err.name) || 'error';
            onError(name === 'NotAllowedError' ? 'not-allowed' : name);
          });
        },
        // onDone(bytes, type, ms), or onDone(null, '', 0) with nothing to stop.
        stop: function (onDone) {
          var rec = recorder;
          if (!rec) { onDone(null, '', 0); return; }
          var ms = Date.now() - recStart;
          rec.onstop = function () {
            var type = rec.mimeType || (recChunks[0] && recChunks[0].type) || 'audio/webm';
            var blob = new Blob(recChunks, { type: type });
            recRelease();
            blob.arrayBuffer().then(function (buf) {
              onDone(new Uint8Array(buf), type, ms);
            }, function () { onDone(null, '', 0); });
          };
          rec.stop();
        },
        cancel: function () {
          if (recorder) {
            recorder.onstop = null;
            try { recorder.stop(); } catch (e) {}
          }
          recRelease();
        }
      };
      // Playing a voice note (voice_player_web.dart). One element for the
      // page, primed by prime() inside the tap: iOS lets an element play only
      // once a tap has started it, and the note's bytes arrive a moment after
      // the tap, from IndexedDB or the server.
      var player = null, playerUrl = null, playerEnd = null;
      function silence() {
        var n = 800, b = new Uint8Array(44 + n), v = new DataView(b.buffer);
        var w = function (o, s) { for (var i = 0; i < s.length; i++) b[o + i] = s.charCodeAt(i); };
        w(0, 'RIFF'); v.setUint32(4, 36 + n, true); w(8, 'WAVEfmt ');
        v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
        v.setUint32(24, 8000, true); v.setUint32(28, 8000, true);
        v.setUint16(32, 1, true); v.setUint16(34, 8, true);
        w(36, 'data'); v.setUint32(40, n, true); b.fill(128, 44);
        return URL.createObjectURL(new Blob([b], { type: 'audio/wav' }));
      }
      function playerFinish(error) {
        var end = playerEnd;
        playerEnd = null;
        if (playerUrl) URL.revokeObjectURL(playerUrl);
        playerUrl = null;
        if (end) end(error);
      }
      window.todoAudio = {
        prime: function () {
          if (!player) player = new Audio();
          if (playerEnd) return;
          player.src = silence();
          player.play().catch(function () {});
        },
        // onEnd('') at the end, onEnd(reason) if it could not play.
        play: function (bytes, type, onEnd) {
          if (!player) player = new Audio();
          playerFinish('stopped');
          playerUrl = URL.createObjectURL(new Blob([bytes], { type: type }));
          playerEnd = onEnd;
          var url = playerUrl;
          player.onended = function () { if (playerUrl === url) playerFinish(''); };
          player.onerror = function () { if (playerUrl === url) playerFinish('error'); };
          player.src = url;
          player.play().catch(function (e) {
            if (playerUrl === url) playerFinish((e && e.name) || 'error');
          });
        },
        stop: function () {
          if (player) player.pause();
          playerFinish('stopped');
        }
      };
      var probes = {};
      function inset(side) {
        var probe = probes[side];
        if (!probe) {
          probe = probes[side] = document.createElement('div');
          probe.style.cssText =
            'position:fixed;left:0;' + side + ':0;width:0;visibility:hidden;' +
            'pointer-events:none;height:env(safe-area-inset-' + side + ',0px)';
          document.documentElement.appendChild(probe);
        }
        return probe.getBoundingClientRect().height;
      }
      window.todoSafeBottom = function () { return inset('bottom'); };
      // The status bar's strip, which the page runs under in a home-screen
      // app (black-translucent, above).
      window.todoSafeTop = function () { return inset('top'); };
      // The app's window colour, for the strip round the clock.
      window.todoChromeColor = function (hex) {
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', hex);
        document.documentElement.style.background = hex;
        document.body.style.background = hex;
      };
    })();
  </script>
  <script>
    // Web Push, for lib/web_push_web.dart. Promises throughout; enable() asks
    // for permission before its first await, because the browser only shows
    // the prompt while the tap that asked for it is still being handled.
    (function () {
      function ios() {
        return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
          (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      }
      function standalone() {
        return navigator.standalone === true ||
          window.matchMedia('(display-mode: standalone)').matches;
      }
      function supported() {
        return 'serviceWorker' in navigator && 'PushManager' in window &&
          'Notification' in window;
      }
      function key(base64) {
        var pad = '='.repeat((4 - (base64.length % 4)) % 4);
        var raw = atob((base64 + pad).replace(/-/g, '+').replace(/_/g, '/'));
        var out = new Uint8Array(raw.length);
        for (var i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
        return out;
      }
      async function current() {
        if (!supported()) return null;
        var reg = await navigator.serviceWorker.getRegistration('./');
        return reg ? reg.pushManager.getSubscription() : null;
      }
      window.todoPush = {
        // 'unsupported' | 'install' | 'denied' | 'off' | 'on'
        state: async function () {
          if (!supported()) {
            return ios() && !standalone() ? 'install' : 'unsupported';
          }
          if (Notification.permission === 'denied') return 'denied';
          return (await current()) ? 'on' : 'off';
        },
        // The subscription as JSON, or null if permission was not given.
        enable: async function (publicKey) {
          var permission = await Notification.requestPermission();
          if (permission !== 'granted') return null;
          var reg = await navigator.serviceWorker.register('push_sw.js', { scope: './' });
          await navigator.serviceWorker.ready;
          var sub = await reg.pushManager.getSubscription() ||
            await reg.pushManager.subscribe({
              userVisibleOnly: true,
              applicationServerKey: key(publicKey),
            });
          return JSON.stringify(sub);
        },
        current: async function () {
          var sub = await current();
          return sub ? JSON.stringify(sub) : null;
        },
        // The endpoint that was given up, so the server can forget it.
        disable: async function () {
          var sub = await current();
          if (!sub) return null;
          var endpoint = sub.endpoint;
          await sub.unsubscribe();
          return endpoint;
        },
      };
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
